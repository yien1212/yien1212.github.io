<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妳是小昀ㄛ ❤️</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #fff0f5;
            position: relative;
            overflow: hidden;
        }
        h1 {
            color: #ff69b4;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1rem;
            color: #333;
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }
        .hidden {
            display: none;
        }
        #passwordInput {
            padding: 10px;
            font-size: 1rem;
            margin-top: 20px;
            border: 2px solid #ff69b4;
            border-radius: 25px;
            width: 80%;
            max-width: 300px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        #passwordInput:focus {
            border-color: #ff1493;
        }
        #submitBtn {
            padding: 10px 20px;
            font-size: 1rem;
            margin-top: 10px;
            border: none;
            background-color: #ff69b4;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
            transition: background-color 0.3s ease;
        }
        #submitBtn:hover {
            background-color: #ff1493;
        }
        /* 照片牆排版 */
        .photo-wall {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .photo-wall img {
            width: 100%;
            max-width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #ff69b4;
            transition: transform 0.3s ease;
        }
        .photo-wall img:hover {
            transform: scale(1.05);
        }
        /* 愛心遊戲相關樣式 */
        .heart-game {
            position: absolute;
            font-size: 30px;
            cursor: pointer;
            animation: float 5s linear infinite;
            color: #ff69b4;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
        #heartCounter {
            font-size: 1.5rem;
            color: #ff69b4;
            margin-top: 20px;
        }
        /* 背景動畫（飄落的花瓣） */
        @keyframes fall {
            0% { transform: translateY(-10%); opacity: 0; }
            100% { transform: translateY(110%); opacity: 1; }
        }
        .petal {
            position: absolute;
            font-size: 20px;
            color: #ff69b4;
            animation: fall 10s linear infinite;
        }
        /* 猜密碼提示 */
        #passwordHint {
            color: #ff69b4;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        /* 輸入錯誤動畫 */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .shake {
            animation: shake 0.5s;
        }
        /* 音樂播放器樣式 */
        #musicPlayer {
            margin-top: 20px;
        }
        #musicPlayer button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            background-color: #ff69b4;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s ease;
        }
        #musicPlayer button:hover {
            background-color: #ff1493;
        }
    </style>
</head>
<body>
    <h1>欸 你不會每天都看一遍吧❤️</h1>
    <p>我覺得妳猜不到</p>
    <input type="password" id="passwordInput" placeholder="輸入密碼">
    <button id="submitBtn">解鎖</button>
    <div id="passwordHint" class="hidden">不可能真的猜不到吧 笨蛋</div>
    <div id="surpriseContent" class="hidden">
        <h2>驚喜吧</h2>
        <p>今天終於又鼓起勇氣講出了我早就想對妳講的話，雖然你好像沒有很意外。我知道我們的關係並不完美，我們也有很多不同的地方，但這些…</p>
        <p>過去一段時間我們的關係都很奇怪，妳也一直在包容我的無理取鬧跟不負責任。一直以來我都覺得自己是孤單一個人的，很多難過跟痛苦的…</p>
        <p><strong>luv u ❤️</strong></p>
        <!-- 照片牆 -->
        <div class="photo-wall">
            <img src="IMG_8145.JPG" alt="我們的回憶">
            <img src="IMG_8168.JPG" alt="我們的回憶">
            <img src="QQAM2028.JPG" alt="我們的回憶">
            <img src="IMG_5576.jpg" alt="我們的回憶">
            <img src="IMG_6957.jpg" alt="我們的回憶">
        </div>
        <!-- 留言板 -->
        <div id="commentSection">
            <h3>留言板<3 這個只有妳自己能看到希望妳不要偷偷罵我</h3>
            <textarea id="commentInput" placeholder="留言..."></textarea>
            <button id="commentBtn">提交</button>
            <div id="comments"></div>
        </div>
        <!-- 愛心遊戲 -->
        <div id="heartGame" class="hidden">
            <h3>點擊愛心收集驚喜！</h3>
            <div id="heartCounter">已收集：0 個 ❤️</div>
        </div>
    </div>

    <!-- 背景動畫（飄落的花瓣） -->
    <div class="petal">🌸</div>
    <div class="petal" style="left: 20%; animation-delay: 2s;">🌸</div>
    <div class="petal" style="left: 40%; animation-delay: 4s;">🌸</div>
    <div class="petal" style="left: 60%; animation-delay: 6s;">🌸</div>
    <div class="petal" style="left: 80%; animation-delay: 8s;">🌸</div>

    <!-- 音樂播放器 -->
    <div id="musicPlayer">
        <audio id="backgroundMusic" autoplay loop>
            <source src="your-music-file.mp3" type="audio/mpeg">
            您的瀏覽器不支持播放音樂。
        </audio>
        <button id="playBtn">播放</button>
        <button id="pauseBtn">暫停</button>
    </div>


    <h2>我們在一起已經 <span id="daysTogether"></span> 天了 ❤️</h2>
    <script>
        // 設定開始日期
        const startDate = new Date(2024, 11, 13); // 月份需用 0-11 表示, 11=12月

        function updateDaysTogether() {
            const now = new Date(); // 取得當前時間
            const timeDiff = now - startDate; // 差值 => 毫秒
            const daysTogether = Math.floor(timeDiff / (1000 * 60 * 60 * 24)); // 換算天數
            document.getElementById("daysTogether").innerText = daysTogether; // 更新HTML
        }

        updateDaysTogether(); // 頁面載入時更新
    </script>
</body>
</html>
