<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妳是小昀ㄛ ❤️</title>
    <style>
        /* existing styles unchanged */
    </style>
</head>
<body>
    <h1>欸 你不會每天都看一遍吧❤️</h1>
    <p>我覺得妳猜不到</p>
    <h2>我們在一起已經 <span id="daysTogether"></span> 天了 ❤️</h2>

    <script>
        // 設定開始日期
        const startDate = new Date("2024-12-13"); // 使用ISO格式，避免月份錯誤

        function updateDaysTogether() {
            const now = new Date();
            const timeDiff = now - startDate;
            const daysTogether = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const daysText = daysTogether >= 0 ? daysTogether : "0"; // 確保過去天數不為負

            const daysTogetherElement = document.getElementById("daysTogether");
            if (daysTogetherElement) {
                daysTogetherElement.textContent = daysText;
            }
        }

        // 調用更新函數，當網頁首次裝載時執行
       document.addEventListener("DOMContentLoaded", updateDaysTogether);
 </script>
</body>
</html>
