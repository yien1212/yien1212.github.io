<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妳是小昀ㄛ ❤️</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #fff0f5;
            position: relative;
            overflow-x: hidden;
        }
        h1 {
            color: #ff69b4;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1rem;
            color: #333;
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }
        .hidden {
            display: none;
        }
        /* 輸入框與按鈕 */
        #passwordInput {
            padding: 12px;
            font-size: 1rem;
            margin-top: 20px;
            border: 2px solid #ff69b4;
            border-radius: 25px;
            width: 80%;
            max-width: 250px;
            outline: none;
            text-align: center;
        }
        #submitBtn {
            padding: 10px 25px;
            font-size: 1rem;
            margin-top: 15px;
            border: none;
            background-color: #ff69b4;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        #submitBtn:hover {
            background-color: #ff1493;
        }

        /* 時光計時器樣式 */
        #timerSection {
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 20px;
            border: 2px dashed #ff69b4;
            max-width: 400px;
        }
        #countdown {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff1493;
            margin-top: 10px;
        }

        /* 驚喜紙條樣式 */
        #capsuleSection {
            margin-top: 30px;
            padding: 20px;
        }
        #gachaBtn {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            background-color: #ff69b4;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,105,180,0.3);
        }
        #gachaResult {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ff1493;
            font-weight: bold;
            min-height: 40px;
        }

        /* 照片牆 */
        .photo-wall {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .photo-wall img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #ff69b4;
            transition: 0.3s;
        }
        .photo-wall img:hover {
            transform: scale(1.1);
        }

        /* 愛心遊戲 */
        .heart-game {
            position: absolute;
            font-size: 30px;
            cursor: pointer;
            z-index: 100;
            user-select: none;
        }
        #heartCounter {
            font-size: 1.2rem;
            color: #ff69b4;
            margin-top: 10px;
        }

        /* 背景飄落花瓣 */
        .petal {
            position: fixed;
            top: -10%;
            font-size: 20px;
            color: #ff69b4;
            user-select: none;
            z-index: -1;
            animation: fall 10s linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.5; }
        }

        /* 震動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s; }
    </style>
</head>
<body>

    <h1>欸 你不會每天都看一遍吧❤️</h1>
    <div id="loginArea">
        <p>我覺得妳猜不到密碼</p>
        <input type="password" id="passwordInput" placeholder="輸入密碼">
        <br>
        <button id="submitBtn">解鎖</button>
        <div id="passwordHint" class="hidden" style="color:#ff69b4; margin-top:10px;">密碼是我們在一起的日期喔笨蛋</div>
    </div>

    <div id="surpriseContent" class="hidden">
        <h2>驚喜吧！</h2>
        <p>今天終於又鼓起勇氣講出了我早就想對妳講的話...</p>
        <p>（這裡保留妳原本感人的長文字內容...）</p>
        <p><strong>luv u ❤️</strong></p>

        <div id="timerSection">
            <h3 style="color: #ff1493; margin:0;">我們已經在一起</h3>
            <div id="countdown">計算中...</div>
        </div>

        <div class="photo-wall">
            <img src="IMG_8145.JPG" alt="回憶1">
            <img src="IMG_8168.JPG" alt="回憶2">
            <img src="QQAM2028.JPG" alt="回憶3">
            <img src="IMG_5576.jpg" alt="回憶4">
            <img src="IMG_6957.jpg" alt="回憶5">
        </div>

        <div id="capsuleSection">
            <button id="gachaBtn">點我：抽一張專屬紙條 💌</button>
            <div id="gachaResult"></div>
        </div>

        <div id="heartGameArea" style="margin-top: 40px;">
            <h3>點擊出現的愛心收集驚喜！</h3>
            <div id="heartCounter">已收集：0 個 ❤️</div>
            <div id="heartSpace" style="position:relative; height: 200px;"></div>
        </div>
    </div>

    <div class="petal" style="left: 10%; animation-delay: 0s;">🌸</div>
    <div class="petal" style="left: 30%; animation-delay: 2s;">🌸</div>
    <div class="petal" style="left: 50%; animation-delay: 4s;">🌸</div>
    <div class="petal" style="left: 70%; animation-delay: 6s;">🌸</div>
    <div class="petal" style="left: 90%; animation-delay: 1s;">🌸</div>

    <div id="musicPlayer" style="margin-top: 50px;">
        <audio id="backgroundMusic" loop>
            <source src="your-music-file.mp3" type="audio/mpeg">
        </audio>
        <button onclick="document.getElementById('backgroundMusic').play()" style="border-radius:20px; border:none; padding:5px 15px;">🎵 播放</button>
        <button onclick="document.getElementById('backgroundMusic').pause()" style="border-radius:20px; border:none; padding:5px 15px;">🔇 暫停</button>
    </div>

    <script>
        // --- 1. 基礎設定 ---
        const correctPassword = "0209";
        const startDate = new Date(2024, 11, 13); // 2024/12/13 (月份要減1)

        // --- 2. 解鎖邏輯 ---
        document.getElementById("submitBtn").addEventListener("click", function() {
            const input = document.getElementById("passwordInput").value;
            if (input === correctPassword) {
                document.getElementById("loginArea").classList.add("hidden");
                document.getElementById("surpriseContent").classList.remove("hidden");
                
                // 啟動功能
                startTimer();
                startHeartGame();
                // 嘗試自動播放音樂
                document.getElementById("backgroundMusic").play().catch(() => {});
            } else {
                const el = document.getElementById("passwordInput");
                el.classList.add("shake");
                document.getElementById("passwordHint").classList.remove("hidden");
                setTimeout(() => el.classList.remove("shake"), 400);
                el.value = "";
            }
        });

        // --- 3. 計時器邏輯 ---
        function startTimer() {
            function update() {
                const diff = new Date() - startDate;
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff / 3600000) % 24);
                const m = Math.floor((diff / 60000) % 60);
                const s = Math.floor((diff / 1000) % 60);
                document.getElementById("countdown").innerHTML = `${d}天 ${h}時 ${m}分 ${s}秒`;
            }
            update();
            setInterval(update, 1000);
        }

        // --- 4. 驚喜紙條邏輯 ---
        const notes = [
            "第一次見到妳的時候，沒想到會這麼喜歡妳。",
            "最喜歡妳笑起來眼睛彎彎的樣子。",
            "不管是哪一面的妳，在我眼裡都很可愛。",
            "妳是這世界上最值得被愛的笨蛋。",
            "我會一直等在妳隨時可以牽住的距離。",
            "希望妳可以一直放心大膽地開心地當小朋友。",
            "今天也要記得，妳真的很棒！"
        ];
        document.getElementById("gachaBtn").addEventListener("click", function() {
            const res = document.getElementById("gachaResult");
            res.style.opacity = 0;
            setTimeout(() => {
                res.innerText = "✨ " + notes[Math.floor(Math.random() * notes.length)] + " ✨";
                res.style.opacity = 1;
            }, 200);
        });

        // --- 5. 愛心遊戲邏輯 ---
        let count = 0;
        function startHeartGame() {
            const space = document.getElementById("heartSpace");
            setInterval(() => {
                if(document.querySelectorAll('.heart-game').length > 5) return;
                const h = document.createElement("div");
                h.innerHTML = "❤️";
                h.className = "heart-game";
                h.style.left = Math.random() * 90 + "%";
                h.style.top = Math.random() * 80 + "%";
                h.onclick = function() {
                    count++;
                    document.getElementById("heartCounter").innerText = "已收集：" + count + " 個 ❤️";
                    this.remove();
                    if(count % 10 === 0) alert("收集到 10 個愛心！送妳一個大抱抱！");
                };
                space.appendChild(h);
                setTimeout(() => h.remove(), 4000);
            }, 2000);
        }
    </script>
</body>
</html>
